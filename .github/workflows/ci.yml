# CI (N02, N03): pruebas por regla del backend y build + pruebas del front.
# Plantilla común del portafolio adaptada a Verificarro (backend/ FastAPI + frontend/ React/Vite).
#
# Un job «skipped» por depender de otro en rojo NO es verde: en la rama protegida (master) los dos
# jobs de este flujo y los de seguridad.yml deben ser checks requeridos.
#
# Historia: el flujo anterior (MOD-008) quedó rojo desde el 3-may-2026 porque el lifespan de la app
# descargaba Chromium durante las pruebas y eso cambiaba el resultado de otras (ver
# docs/adr/0004-pruebas-hermeticas-sin-navegador.md). Las pruebas no tocan la red.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancela corridas viejas de la misma rama (ahorra minutos cuando hay varios push seguidos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: pruebas backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12']
    defaults:
      run:
        working-directory: backend
    env:
      # Valores de prueba para que la app arranque sin secretos reales: SQLite en memoria y
      # clientes externos (Claude, Mercado Pago, SMTP, REPUVE, NHTSA, SAT) simulados en las pruebas.
      ENV: test
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      JWT_SECRET: ci-test-secret-not-used-in-production
      ANTHROPIC_API_KEY: dummy-test-key
      MP_ACCESS_TOKEN: TEST-dummy-not-used
      MP_WEBHOOK_SECRET: ''
      CORS_ORIGINS: http://localhost:5173
      MAGIC_LINK_BASE_URL: http://localhost:5173/auth/verify
      SMTP_HOST: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # pytest sale con 5 si no encontró pruebas: eso ya falla. La cobertura se reporta, no es la
      # compuerta; la compuerta es una prueba por regla (docs/reglas.md).
      - run: pytest -q --junitxml=reporte.xml --cov=app --cov-report=xml --cov-report=term
      - run: python3 ../herramientas/verificar_reportes.py pytest reporte.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pruebas-${{ matrix.python }}
          path: |
            backend/reporte.xml
            backend/coverage.xml

  front:
    name: front (pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm test` es vitest en modo observación; en CI se usa la corrida única.
      - run: npm run test:run
      - run: npm run build
      # Presupuesto del bundle de entrada (Vercel sirve estáticos): falla si el JS pasa de 1 MB.
      - name: tamaño del bundle
        run: |
          JS_SIZE=$(stat -c%s dist/assets/index-*.js)
          CSS_SIZE=$(stat -c%s dist/assets/index-*.css)
          echo "JS=$JS_SIZE bytes  CSS=$CSS_SIZE bytes"
          if [ "$JS_SIZE" -gt 1048576 ]; then
            echo "::error::El bundle JS de entrada excede 1 MB"
            exit 1
          fi
