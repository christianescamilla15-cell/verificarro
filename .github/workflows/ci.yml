# Verificarro CI — pytest backend + vite build frontend
#
# Por qué: antes de MOD-008, cada `git push` era una apuesta. Si Christian
# pusheaba un commit roto, Render auto-deployaba en 5 min y producción
# quedaba caída. Este workflow corre en cada push a master y en cada PR
# antes de que se permita merge — el bug se atrapa antes del deploy.
#
# Branch protection: configurar en GitHub repo Settings → Branches → master
# → "Require status checks" con `backend-tests` y `frontend-build` como
# checks obligatorios.
#
# Tiempo estimado: ~3-5 min total. backend-tests es lo que más tarda
# (instalación de dependencies + pytest 437 tests).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancela runs viejos en el mismo branch — ahorra minutos del free tier
# cuando Christian pushea varios commits seguidos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # NO instalamos playwright browsers — los tests live están skip-eados
      # (test_mercadolibre_live.py, test_repuve_live.py). Si en algún
      # momento necesitamos correrlos en CI: agregar `playwright install
      # chromium --with-deps` aquí (pesa ~600 MB y tarda ~90s).

      - name: Run pytest
        working-directory: backend
        env:
          # Defaults para que la app inicie en CI sin secrets reales.
          # Los tests usan SQLite in-memory + mocks de SDK externos.
          ENV: "test"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: "ci-test-secret-not-used-in-production"
          ANTHROPIC_API_KEY: "dummy-test-key"
          MP_ACCESS_TOKEN: "TEST-dummy-not-used"
          MP_WEBHOOK_SECRET: ""
          CORS_ORIGINS: "http://localhost:5173"
          MAGIC_LINK_BASE_URL: "http://localhost:5173/auth/verify"
          SMTP_HOST: ""
        run: |
          python -m pytest --tb=line -q

  frontend-build:
    name: Frontend Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npx vite build

      # Asserts informativos: si el bundle se infla más allá de lo que
      # Vercel free tier maneja, fail fast. Limit suelto (1 MB JS) para
      # no romper en cada commit; cuando MOD-021 (code splitting) baje
      # a ~120KB podemos endurecer este check.
      - name: Bundle size sanity
        working-directory: frontend
        run: |
          JS_SIZE=$(stat -c%s dist/assets/index-*.js)
          CSS_SIZE=$(stat -c%s dist/assets/index-*.css)
          echo "JS=$JS_SIZE bytes  CSS=$CSS_SIZE bytes"
          if [ "$JS_SIZE" -gt 1048576 ]; then
            echo "::error::JS bundle excede 1 MB"
            exit 1
          fi
