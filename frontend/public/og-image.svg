<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="50%" stop-color="#0c1729"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e64dc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo + Brand (V/✓ mark, mismo glifo que favicon) -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="18" fill="url(#brand)"/>
    <path
      d="M 20 27.5 L 40 55 L 62.5 22.5"
      fill="none" stroke="white" stroke-width="8.5"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text
    x="180" y="135"
    fill="white" font-family="Inter, system-ui, sans-serif"
    font-size="58" font-weight="700" letter-spacing="-1.5">
    verifica<tspan fill="#06b6d4">rro</tspan>
  </text>

  <!-- Main heading -->
  <text
    x="80" y="280"
    fill="white" font-family="Inter, system-ui, sans-serif"
    font-size="76" font-weight="800" letter-spacing="-2">
    Checa tu auto antes
  </text>
  <text
    x="80" y="370"
    fill="white" font-family="Inter, system-ui, sans-serif"
    font-size="76" font-weight="800" letter-spacing="-2">
    de <tspan fill="url(#brand)">soltar el cash</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="80" y="460"
    fill="#94a3b8" font-family="Inter, system-ui, sans-serif"
    font-size="32" font-weight="500">
    REPUVE · Precio justo · Factura SAT · Anti placa-clonada
  </text>

  <!-- Pricing pill -->
  <g transform="translate(80, 510)">
    <rect width="320" height="60" rx="30" fill="#1e64dc" opacity="0.15"
          stroke="#1e64dc" stroke-width="1.5"/>
    <text
      x="30" y="38"
      fill="#06b6d4" font-family="Inter, system-ui, sans-serif"
      font-size="22" font-weight="600">
      Preview gratis · $49 MXN reporte
    </text>
  </g>

  <!-- URL bottom-right -->
  <text
    x="1120" y="590" text-anchor="end"
    fill="#475569" font-family="Inter, system-ui, sans-serif"
    font-size="22" font-weight="500">
    verificarro.mx
  </text>
</svg>
